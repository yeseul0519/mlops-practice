name: MLOps CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t iris-api:test .

      - name: Run Docker container
        run: docker run -d --name iris-api-test -p 8000:8000 iris-api:test

      - name: Wait for API
        run: |
          for i in {1..30}; do
            if curl -f http://127.0.0.1:8000/; then
              exit 0
            fi
            sleep 2
          done
          docker logs iris-api-test
          exit 1

      - name: Test prediction API
        run: |
          python -m pip install requests
          python test_api.py

      - name: Show container logs on failure
        if: failure()
        run: docker logs iris-api-test

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag Docker image
        if: github.event_name == 'push'
        run: |
          docker tag iris-api:test ghcr.io/yeseul0519/mlops-practice:latest
          docker tag iris-api:test ghcr.io/yeseul0519/mlops-practice:${{ github.sha }}

      - name: Push Docker image
        if: github.event_name == 'push'
        run: |
          docker push ghcr.io/yeseul0519/mlops-practice:latest
          docker push ghcr.io/yeseul0519/mlops-practice:${{ github.sha }}